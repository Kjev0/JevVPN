---
# Builds the JevVPN Linux packages (.deb, .rpm and the self-extracting .run installer), tests the
# .run in Arch Linux and Ubuntu containers, and uploads them to a GitHub release.
name: Linux packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload the packages to (e.g. v2026.5-dev-0af83f)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build .deb, .rpm and .run (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: ./.github/actions/mullvad-build-env

      - name: Install packaging tools
        run: sudo apt-get install -y rpm

      - name: Build packages
        shell: bash
        run: ./build.sh --optimize

      - name: Build .run installer
        shell: bash
        run: |
          deb=(dist/*.deb)
          bash dist-assets/linux/run-installer/make-run-installer.sh "${deb[0]}" \
            "${deb[0]%_amd64.deb}_x86_64.run"

      - name: Test .run installer (Arch Linux)
        run: |
          docker run --rm -v "$PWD:/w" archlinux:latest bash -c \
            'pacman -Syu --noconfirm && bash /w/dist-assets/linux/run-installer/test-in-container.sh /w/dist/*.run'

      - name: Test .run installer (Ubuntu)
        run: |
          docker run --rm -v "$PWD:/w" ubuntu:24.04 bash -c \
            'apt-get update -qq && apt-get install -y -qq xz-utils libdbus-1-3 && bash /w/dist-assets/linux/run-installer/test-in-container.sh /w/dist/*.run'

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shopt -s nullglob
          packages=(*.deb *.rpm *.run)
          if (( ${#packages[@]} == 0 )); then
            echo "No packages were produced" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            sha256sum "$package" > "$package.sha256"
          done
          gh release upload "${{ inputs.tag }}" "${packages[@]}" ./*.sha256 --clobber \
            -R "${{ github.repository }}"
